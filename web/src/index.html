<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NFS Porsche Unleashed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #bbb; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; height: 100%; outline: none; cursor: none; }
  #status { position: fixed; left: 8px; bottom: 8px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="960" tabindex="0"></canvas></div>
<div id="status">Starting...</div>
<script type="module" src="/main.js"></script>
</body>
</html>
