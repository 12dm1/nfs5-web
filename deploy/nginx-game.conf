    # nfs5-web (deploy/install-web.sh): the browser game. / = PLAY page, /game = the game, the rest = its
    # files from the node server on the loopback (it sends the COOP/COEP headers SharedArrayBuffer needs).
    location / {
        proxy_pass http://127.0.0.1:9460;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering on;
        gzip on;
        gzip_proxied any;
        gzip_types application/wasm text/javascript application/json text/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    # the icons stay files of the old site folder
    location = /favicon.ico { try_files $uri =404; }
    location = /apple-touch-icon.png { try_files $uri =404; }
