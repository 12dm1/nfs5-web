    # nfs5-web online (deploy/install-online.sh): the browsers' virtual network, a WebSocket to the
    # online server on the loopback. Inserted into the nfs5-reforged server block before its last "}".
    location = /lan {
        auth_basic off;
        proxy_pass http://127.0.0.1:9450/lan;
        proxy_http_version 1.1;
        # CLOUD1: the site's host (the server checks the page's Origin against it) and the client's address (at most
        # 16 connections per address)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /lan-status {
        auth_basic off;
        proxy_pass http://127.0.0.1:9450/status;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store";
    }
